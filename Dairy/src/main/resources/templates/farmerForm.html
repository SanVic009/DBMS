<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Farmer Form</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Farmer Form</h1>
    <form action="#" th:action="@{/submitFarmer}" method="post">
        <label for="farmerName">Farmer Name:</label>
        <input type="text" id="farmerName" name="farmerName" required><br><br>
        
        <label for="contactNo">Contact No:</label>
        <input type="tel" id="contactNo" name="contactNo" required><br><br>
        
        <label for="address">Address:</label>
        <input type="text" id="address" name="address" required><br><br>
        
        <label for="noOfCows">Number of Cows:</label>
        <input type="number" id="noOfCows" name="noOfCows" required><br><br>
        
        <label for="milkProductionCapacity">Milk Production Capacity:</label>
        <input type="number" id="milkProductionCapacity" name="milkProductionCapacity" required><br><br>
        
        <label for="accountNo">Account No:</label>
        <input type="number" id="accountNo" name="accountNo" required><br><br>
        
        <label for="dateOfJoining">Date of Joining:</label>
        <input type="date" id="dateOfJoining" name="dateOfJoining" required><br><br>
        
        <button type="submit">Submit</button>
    </form>
    
    <h2><a href="/farmers">View Farmers</a></h2>
</body>
</html>
